# Usage: ansible-playbook -i inventories/ubuntu-1-inv.yml --ask-pass ubuntu-1-play.yml -K
- name: ubuntu config
  hosts: ubuntu-1
  tasks:
  - name: Create the .ssh directory
    file:
      path: "/home/{{ ansible_user }}/.ssh"
      state: directory
      mode: 0700
    
  - name: Create authorized_keys file
    file:
      path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
      state: touch
      mode: 0644
    
  - name: Append public key to authorized_keys
    blockinfile:
      dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
      block: "{{ public_key }}"

  - name: Set the hostname
    become: yes
    hostname:
      name: "{{ hostname }}"
    
  - name: Update /etc/hosts file
    lineinfile:
      path: /etc/hosts
      line: "127.0.1.1  {{ hostname }}"
    become: yes

  - name: Remove the old netplan file
    file:
      path: "/etc/netplan/00-installer-config.yaml"
      state: absent
    become: yes
    
  - name: Create a new netplan configuration
    copy:
      dest: "/etc/netplan/01-netcfg.yaml"
      content: |
        network:
          version: 2
          ethernets:
             {{ device }}:
              dhcp4: no
              addresses:
                - {{ lan_ip }}/{{ prefix }}
              routes:
                - to: default
                  via: {{ gateway }}
              nameservers:
                addresses:
                  - {{ name_server }}
                  - {{ gateway }}
      mode: 0600
    become: yes

  - name: Bounce the box
    shell: "sleep 5 && shutdown -r now"
    become: yes
    async: 1
    poll: 0